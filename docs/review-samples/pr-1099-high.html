<head>

<title>Review page v2</title>
<!--
  human-review-guide v2 page. DRAFT: pending operator approval. LOCAL ONLY: never publish or post.
  Self-contained, no network. The driving session replaces the single `const PAGE = ...` line
  with facts from `squadrant verify risk` + .squadrant/evidence/<sha>.json + the PR diff.
-->
<style>
:root{--bg:#f7f7f9;--panel:#fff;--text:#1d1f24;--muted:#5d6370;--line:#dcdfe6;--accent:#2f5bea;--ok:#1a7f4b;--warn:#a15c00;--bad:#c0392b;--chip:#eef1f8;--add:#e6f6ec;--del:#fdeaea}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--panel:#1d2026;--text:#e6e8ee;--muted:#9aa1b0;--line:#323744;--accent:#7b9cff;--ok:#4cc38a;--warn:#e0a24a;--bad:#ff7b6b;--chip:#272b34;--add:#17301f;--del:#3a1d1d}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 64px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;flex:1 1 240px}h2{font-size:16px;margin:24px 0 8px}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
button.primary,button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.04em;color:#fff}
.local{background:var(--bad)}.draft{background:var(--warn)}
.tier{font-size:13px;font-weight:700;padding:3px 12px;border-radius:99px;color:#fff}
.tier.high{background:var(--bad)}.tier.med{background:var(--warn)}.tier.low{background:var(--ok)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.verdict{font-size:17px;font-weight:600}
.chip{display:inline-block;background:var(--chip);border-radius:99px;padding:1px 10px;font-size:12px;margin:2px 4px 2px 0}
.chip.ok{color:var(--ok)}.chip.bad{color:var(--bad)}.chip.warn{color:var(--warn);font-weight:700}
code{background:var(--chip);padding:1px 5px;border-radius:5px;font:13px ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
pre.diff{background:var(--chip);padding:8px 0;border-radius:8px;overflow-x:auto;margin:6px 0;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace}
pre.diff span{display:block;padding:0 10px;white-space:pre}
pre.diff .a{background:var(--add)}pre.diff .d{background:var(--del)}pre.diff .h{color:var(--muted)}
.muted{color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}th{color:var(--muted)}
.q{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.choices{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
textarea{width:100%;min-height:54px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit;color:var(--text)}
ul{margin:4px 0;padding-left:20px}
.ctx dl{margin:0}.ctx dt{font-weight:700;margin-top:8px}.ctx dd{margin:2px 0 0}.ctx details>summary{cursor:pointer;font-weight:700}
.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:7px 14px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
</style>
</head>

const PAGE = {"pr": 1099, "title": "chokepoint never types into a pane with no agent; ping/runtime send queue when unreachable (#1098)", "sha": "ebd034a66a02e16d372f17c5fb43cbe4e9e8624e", "tier": "high", "files": ["docs/generated/control-events.md", "docs/reference.md", "packages/cli/src/commands/__tests__/ping.test.ts", "packages/cli/src/commands/__tests__/runtime.test.ts", "packages/cli/src/commands/ping.ts", "packages/cli/src/commands/runtime.ts", "packages/cli/src/lib/queue-if-unreachable.ts", "packages/core/src/__tests__/crew-send-control-channel.test.ts", "packages/core/src/__tests__/session-delivery.test.ts", "packages/core/src/crew-signal.ts", "packages/core/src/crew-spawn.ts", "packages/core/src/session-delivery.ts", "packages/workspaces/src/__tests__/crew-pane.test.ts", "packages/workspaces/src/crew-pane.ts", "packages/workspaces/src/index.ts", "packages/workspaces/src/runtimes/cmux.ts"], "evidence": null, "hunks": [{"id": "H1", "file": "packages/core/src/session-delivery.ts", "lines": "48", "diff": "@@ -48,5 +48,5 @@ export interface SessionDeliveryDeps {\n   channel?: ControlChannel;\n   /** The #1087 confirmed-submit chokepoint. */\n-  sendToPane: (pane: PaneRef, text: string) => Promise\u003c{ delivered: boolean; blockedByModal?: boolean }>;\n+  sendToPane: (pane: PaneRef, text: string) => Promise\u003c{ delivered: boolean; blockedByModal?: boolean; reason?: \"no-agent\" }>;\n   log?: (m: string) => void;\n }", "invariant": "Delivery verdicts come from agent receipts, never pane scraping; no message is dropped silently", "tests": ["session-delivery.test.ts › deliverToSession (#1096) › unpinned: a pane with no agent reports that, not a draft (#1098)"], "question": {"en": "The new `reason: \"no-agent\"` is optional on the type, so a sender that never sets it keeps the old behaviour. Is an optional reason the right contract, or should the chokepoint always return one?", "vi": "`reason: \"no-agent\"` là tùy chọn trong type, nên sender nào không set vẫn giữ hành vi cũ. Để reason tùy chọn có đúng không, hay chokepoint nên luôn trả về reason?"}, "what": {"en": "Widens the sendToPane result type to carry an optional reason: \"no-agent\".", "vi": "Mở rộng kiểu kết quả của sendToPane để mang thêm reason: \"no-agent\" (tùy chọn)."}, "whyCare": {"en": "It is only a type, but it is the contract that lets the pane layer say \"no agent here\" to every delivery caller. It sits in session-delivery.ts, which the risk map guards because delivery verdicts must be truthful; a wrong type could hide a failure reason.", "vi": "Chỉ là kiểu dữ liệu, nhưng đây là hợp đồng cho phép tầng pane báo \"không có agent\" tới mọi nơi gọi delivery. File session-delivery.ts nằm trong risk-map vì kết luận giao tin phải trung thực; kiểu sai có thể che mất lý do thất bại."}, "impact": [{"area": {"en": "side send / thread send / thread park (via deliverToSession, session-delivery-factory.ts:32)", "vi": "side send / thread send / thread park (qua deliverToSession, session-delivery-factory.ts:32)"}, "kind": "behavior", "note": {"en": "An unpinned session whose agent has exited now fails with \"no agent input box is visible\" instead of a misleading \"draft\" message.", "vi": "Session chưa ghim mà agent đã thoát giờ báo lỗi \"no agent input box is visible\" thay vì thông báo \"draft\" gây hiểu nhầm."}}, {"area": {"en": "crew send (crew.ts:194 passes confirmedSendToPane to crew-spawn deliver)", "vi": "crew send (crew.ts:194 truyền confirmedSendToPane vào deliver của crew-spawn)"}, "kind": "security", "note": {"en": "The pane fallback no longer pastes into a bare shell, so message text cannot run as shell commands. How crew send words this refusal: not checked in this hunk.", "vi": "Đường fallback qua pane không còn dán vào shell trần, nên nội dung tin không thể chạy như lệnh shell. Cách crew send diễn đạt lỗi này: chưa kiểm trong hunk này."}}]}, {"id": "H2", "file": "packages/core/src/session-delivery.ts", "lines": "91", "diff": "@@ -91,4 +91,5 @@ export async function deliverToSession(\n   const r = await deps.sendToPane(pane, text);\n   if (r.delivered) return { via: \"pane\", detail: \"pane, submit confirmed\" };\n+  if (r.reason === \"no-agent\") throw new Error(\"not delivered: no agent input box is visible in that pane — the agent has exited or is showing a screen squadrant does not recognise (nothing was typed).\");\n   throw new Error(\n     r.blockedByModal", "invariant": "Delivery verdicts come from agent receipts, never pane scraping; no message is dropped silently", "tests": ["session-delivery.test.ts › deliverToSession (#1096) › unpinned: a pane with no agent reports that, not a draft (#1098)"], "question": {"en": "A pane with no agent now throws instead of reporting a draft. Does every caller of `deliverToSession` queue or surface this throw, so the message is not dropped silently (see `queue-if-unreachable.ts` in this PR)?", "vi": "Pane không có agent giờ throw thay vì báo là draft. Mọi caller của `deliverToSession` có xếp hàng hoặc báo lỗi này không, để tin nhắn không bị mất im lặng (xem `queue-if-unreachable.ts` trong PR)?"}, "what": {"en": "When the pane layer answers no-agent, deliverToSession throws a specific \"no agent input box is visible\" error before the modal/draft messages.", "vi": "Khi tầng pane trả no-agent, deliverToSession ném lỗi riêng \"no agent input box is visible\", đặt trước các thông báo modal/draft."}, "whyCare": {"en": "This is the line that turns the new refusal into the message the user reads. If its order or wording were wrong, a bare-shell pane would again be reported as a draft, or the error could be swallowed. It touches the risk-map rule that no delivery is dropped silently.", "vi": "Đây là dòng biến việc từ chối mới thành thông báo người dùng đọc. Sai thứ tự hay câu chữ thì pane shell trần lại bị báo là draft, hoặc lỗi bị nuốt. Nó chạm rule risk-map: không được bỏ giao tin trong im lặng."}, "impact": [{"area": {"en": "side send / thread send / thread park (the only callers of deliverToSession: side-session.ts:247, threads.ts:420)", "vi": "side send / thread send / thread park (các nơi duy nhất gọi deliverToSession: side-session.ts:247, threads.ts:420)"}, "kind": "behavior", "note": {"en": "An unpinned session whose agent has exited now fails with \"no agent input box is visible\" instead of a misleading \"draft\" message.", "vi": "Session chưa ghim mà agent đã thoát giờ báo lỗi \"no agent input box is visible\" thay vì thông báo \"draft\" gây hiểu nhầm."}}]}], "context": {"what": {"en": "Stops the pane-send chokepoint from typing into a pane that no longer holds an agent, and makes ping / runtime send queue to the mailbox when the daemon or captain workspace is not running.", "vi": "Ngăn chokepoint gửi vào pane gõ chữ vào pane không còn agent, và cho ping / runtime send xếp hàng vào mailbox khi daemon hoặc workspace của captain không chạy."}, "problem": {"en": ["When an agent exits, its pane is a bare shell. confirmedSendToPane pasted the message and pressed Enter, so the message text ran as shell commands (seen live: side send 'Test $(touch /tmp/x/PWNED)' created the file).", "The CLI then reported \"draft … or the submit was not confirmed\", the wrong reason.", "Exposure after #1097: crew send falls back to the pane when the peer socket is gone."], "vi": ["Khi agent thoát, pane chỉ còn shell trần. confirmedSendToPane vẫn dán tin và nhấn Enter, nên nội dung tin chạy như lệnh shell (thấy trực tiếp: side send 'Test $(touch /tmp/x/PWNED)' đã tạo file).", "CLI còn báo sai lý do: \"draft … or the submit was not confirmed\".", "Sau #1097: crew send rơi về pane khi socket peer đã mất."]}, "rootCause": {"en": ["Before this PR, confirmedSendToPane only guarded native dialog/draft state and hasModalOptionList (packages/workspaces/src/crew-pane.ts:148-162) and then went straight to submitAndConfirm. Nothing checked that the pane still held an agent, so a bare shell received the paste plus Enter.", "The fix is the added hasAgentInputBox check at crew-pane.ts:163. A native \"empty\" input state on a bare shell no longer counts as safe to send."], "vi": ["Trước PR này, confirmedSendToPane chỉ chặn trạng thái dialog/draft gốc và hasModalOptionList (packages/workspaces/src/crew-pane.ts:148-162) rồi gọi thẳng submitAndConfirm. Không có bước nào kiểm tra pane còn agent hay không, nên shell trần nhận cả đoạn dán lẫn Enter.", "Bản sửa là dòng kiểm tra hasAgentInputBox thêm vào ở crew-pane.ts:163. Trạng thái input gốc \"empty\" trên shell trần không còn được coi là an toàn để gửi."]}, "approach": {"en": ["Require a recognised agent input box (claude/codex rule-bounded box, opencode ┃ box) before pasting. No box ⇒ { delivered: false, reason: \"no-agent\" }, nothing typed, even if cmux reports the input empty.", "Refuse unrecognised composers rather than guess (no codex pane fixture in the repo).", "ping / runtime send share one helper that queues only on the two \"not running\" errors; an unknown project is still an error.", "Known limit: the check is screen-based, so a stale box above a shell prompt could pass."], "vi": ["Yêu cầu thấy input box của agent (box claude/codex có rule, box ┃ của opencode) trước khi dán. Không có box ⇒ { delivered: false, reason: \"no-agent\" }, không gõ gì, kể cả khi cmux báo input rỗng.", "Từ chối composer không nhận diện được thay vì đoán (repo chưa có fixture pane codex).", "ping / runtime send dùng chung một helper, chỉ xếp hàng với đúng hai lỗi \"not running\"; project không tồn tại vẫn là lỗi.", "Giới hạn đã biết: kiểm tra dựa trên màn hình, nên box cũ còn sót phía trên prompt shell có thể lọt."]}, "issues": [1098, 1087, 1097]}};

const T = {
  en: {
    tier:{high:"HIGH risk: human review",med:"MED risk",low:"LOW risk"},
    verdict:{high:"Human review needed: core-logic hunks only.",med:"No human review needed (captain-reviewed).",low:"No human review needed."},

    context:"Context",what:"What this PR is",problem:"Problem it solves",rootCause:"Root cause",approach:"How it solves it",issues:"Issues",evidence:"Local evidence",from:"read from",ok:"GREEN",red:"RED",stale:"STALE",missing:"MISSING",

    files:"Files in this PR",hunks:"Core-logic hunks",what:"What this hunk does",whyCare:"Why look at it",impact:"What it affects",rule:"Rule (risk-map)",ruleTip:"A risk-map rule is a line in .squadrant/risk-map.json: a path glob marked high-risk plus the invariant that code must keep. Touching a matching file puts the PR in the high tier.",kind:{behavior:"behavior",security:"security",feature:"feature",perf:"perf",compat:"compat"},invariant:"Invariant",tests:"Tests that claim to cover it",

    explainPrompt:(h,p)=>`Explain hunk ${h.id} (${h.file}:${h.lines}) of PR #${p.pr} @ ${p.sha.slice(0,12)}: what changed, why, and what would break if it were wrong. Invariant: ${h.invariant}`,
    anchors:"Anchors are pinned to the SHA",done:"judged"
  },
  vi: {
    tier:{high:"Rủi ro CAO: cần người review",med:"Rủi ro TRUNG BÌNH",low:"Rủi ro THẤP"},
    verdict:{high:"Cần người review: chỉ các hunk logic lõi.",med:"Không cần người review (captain đã review).",low:"Không cần người review."},
    verdictSub:{med:"Cổng kiểm: captain review + evidence local xanh.",low:"Cổng kiểm: evidence local xanh."},
    context:"Bối cảnh",what:"PR này là gì",problem:"Vấn đề cần giải quyết",rootCause:"Nguyên nhân gốc",approach:"Cách giải quyết",issues:"Issue",evidence:"Evidence local",from:"đọc từ",ok:"XANH",red:"ĐỎ",stale:"CŨ",missing:"THIẾU",
    staleNote:"Evidence thuộc SHA khác với head của PR. Chạy lại `squadrant verify` trước khi tin.",
    missingNote:"Không có file evidence cho SHA head của PR. Chạy `squadrant verify` trước; đừng merge chỉ dựa vào trang này.",
    step:"bước",exit:"exit",time:"thời gian",counts:"chạy/bỏ qua/lỗi",
    files:"File trong PR",hunks:"Hunk logic lõi",what:"Hunk này làm gì",whyCare:"Vì sao nên xem",impact:"Ảnh hưởng tới",rule:"Rule (risk-map)",ruleTip:"Rule risk-map là một dòng trong .squadrant/risk-map.json: glob đường dẫn được đánh dấu rủi ro cao kèm bất biến mà code đó phải giữ. Sửa file khớp glob sẽ đưa PR vào tier cao.",kind:{behavior:"hành vi",security:"bảo mật",feature:"tính năng",perf:"hiệu năng",compat:"tương thích"},invariant:"Bất biến",tests:"Test khẳng định bao phủ",
    noTests:"Không tìm thấy tên test. Coi như chưa được bao phủ.",question:"Chỉ bạn phán đoán được",ok_:"OK",concern:"Lo ngại",note:"Ghi chú",
    explain:"Nhờ giải thích",copyF:"Copy kết quả",copied:"Đã copy",
    explainPrompt:(h,p)=>`Giải thích hunk ${h.id} (${h.file}:${h.lines}) của PR #${p.pr} @ ${p.sha.slice(0,12)}: đổi gì, vì sao, và sai thì hỏng gì. Bất biến: ${h.invariant}`,
    anchors:"Neo được ghim theo SHA",done:"đã xét"
  }
};
const st = {lang:"en", ans:{}, note:{}};
try{const l=localStorage.getItem("hrg2.lang"); if(l==="vi"||l==="en") st.lang=l;}catch(e){}
const $ = (s)=>document.querySelector(s);
const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tr = (o)=>o&&typeof o==="object"&&("en" in o)?o[st.lang]:o;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1200);}
function copy(text){
  const done=()=>toast(T[st.lang].copied);
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,()=>fallback());}else fallback();
  function fallback(){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){}ta.remove();}
}
function ctxHtml(t){
  const c=PAGE.context; if(!c) return "";
  const li=(v)=>{const x=tr(v);return Array.isArray(x)?`<ul>`+x.map(i=>`<li>${esc(i)}</li>`).join("")+`</ul>`:`<p style="margin:2px 0">${esc(x)}</p>`;};
  const iss=(c.issues&&c.issues.length)?`<dt>${t.issues}</dt><dd>`+c.issues.map(n=>`<span class="chip">#${esc(n)}</span>`).join("")+`</dd>`:"";
  return `<div class="card ctx"><h2 style="margin-top:0">${t.context}</h2><dl><dt>${t.what}</dt><dd>${li(c.what)}</dd><dt>${t.problem}</dt><dd>${li(c.problem)}</dd>${c.rootCause?`<dt>${t.rootCause}</dt><dd>${li(c.rootCause)}</dd>`:""}<dt>${t.approach}</dt><dd>${li(c.approach)}</dd>${iss}</dl></div>`;
}
function evidenceState(){
  const e=PAGE.evidence; if(!e) return "missing";
  if(e.sha!==PAGE.sha) return "stale";
  return e.green?"ok":"red";
}
function evidenceHtml(t){
  const s=evidenceState(), e=PAGE.evidence;
  const cls={ok:"ok",red:"bad",stale:"warn",missing:"warn"}[s];
  const lab={ok:t.ok,red:t.red,stale:t.stale,missing:t.missing}[s];
  let h=`<div class="card"><h2 style="margin-top:0">${t.evidence}</h2><span class="chip ${cls}">${lab}</span>`;
  if(e) h+=`<span class="chip">${esc(e.sha.slice(0,12))}${e.sha===PAGE.sha?"":" ≠ "+esc(PAGE.sha.slice(0,12))}</span><span class="muted"> ${t.from} <code>.squadrant/evidence/${esc(e.sha.slice(0,12))}….json</code></span>`;
  if(s==="stale") h+=`<p class="muted">${t.staleNote}</p>`;
  if(s==="missing") h+=`<p class="muted">${t.missingNote}</p>`;
  if(e&&e.steps) h+=`<table><tr><th>${t.step}</th><th>${t.exit}</th><th>${t.time}</th><th>${t.counts}</th></tr>`+e.steps.map(x=>`<tr><td>${esc(x.name)}${x.required?"":" (optional)"}</td><td>${x.exitCode}</td><td>${(x.durationMs/1000).toFixed(1)}s</td><td>${x.counts?x.counts.ran+"/"+x.counts.skipped+"/"+x.counts.failed:"n/a"}</td></tr>`).join("")+`</table>`;
  if(e&&e.metaFailures&&e.metaFailures.length) h+=`<ul>`+e.metaFailures.map(m=>`<li class="chip bad">${esc(m.check)}: ${esc(m.message)}</li>`).join("")+`</ul>`;
  return h+`</div>`;
}
function diffHtml(d){return `<pre class="diff">`+d.split("\n").map(l=>`<span class="${l[0]==="+"?"a":l[0]==="-"?"d":l.startsWith("@@")?"h":""}">${esc(l)||" "}</span>`).join("")+`</pre>`;}
function hunkHtml(h,t){
  const a=st.ans[h.id]||"";
  const tests=(h.tests&&h.tests.length)?`<ul>`+h.tests.map(x=>`<li><code>${esc(x)}</code></li>`).join("")+`</ul>`:`<p class="chip warn">${t.noTests}</p>`;
  return `<div class="card" data-h="${esc(h.id)}">
    <div><b>${esc(h.id)}</b> <code>${esc(h.file)}:${esc(h.lines)}</code> <span class="muted">@ ${esc(PAGE.sha.slice(0,12))}</span></div>
    ${diffHtml(h.diff)}
    ${h.what?`<div><b>${t.what}:</b> ${esc(tr(h.what))}</div>`:""}
    ${h.whyCare?`<div><b>${t.whyCare}:</b> ${esc(tr(h.whyCare))}</div>`:""}
    ${(h.impact&&h.impact.length)?`<div><b>${t.impact}:</b><table><tr><th>area</th><th>kind</th><th></th></tr>`+h.impact.map(i=>`<tr><td>${esc(tr(i.area))}</td><td><span class="chip ${i.kind==="security"?"bad":""}">${esc(t.kind[i.kind]||i.kind)}</span></td><td>${esc(tr(i.note))}</td></tr>`).join("")+`</table></div>`:""}
    <div class="muted rule" style="font-size:12px"><span title="${esc(t.ruleTip)}" style="cursor:help;border-bottom:1px dotted">${t.rule} ⓘ</span>: ${esc(h.invariant)}</div>
    <div><b>${t.tests}:</b>${tests}</div>
    <div class="q"><b>${t.question}:</b> ${esc(tr(h.question))}
      <div class="choices">${["ok","concern","note"].map(k=>`<button data-a="${k}" data-id="${esc(h.id)}" aria-pressed="${a===k}">${t[k+"_"]||t.ok_}</button>`).join("")}
      <button data-ex="${esc(h.id)}">${t.explain}</button></div>
      <textarea data-note="${esc(h.id)}" placeholder="${t.note}…">${esc(st.note[h.id]||"")}</textarea></div>
  </div>`;
}
function render(){
  const t=T[st.lang], tier=PAGE.tier;
  document.documentElement.lang=st.lang;
  $("#vi").setAttribute("aria-pressed",st.lang==="vi");$("#en").setAttribute("aria-pressed",st.lang==="en");
  $("#title").textContent=`PR #${PAGE.pr}: ${PAGE.title}`;
  let h=`<div class="card"><div class="row"><span class="tier ${tier}">${t.tier[tier]}</span><span class="muted">${t.anchors}: <code>${esc(PAGE.sha.slice(0,12))}</code></span></div>
    <p class="verdict">${t.verdict[tier]}</p>${tier!=="high"?`<p class="muted">${t.verdictSub[tier]}</p>`:""}</div>`;
  h+=ctxHtml(t);
  h+=evidenceHtml(t);
  if(tier==="high"){
    const n=PAGE.hunks.filter(x=>st.ans[x.id]).length;
    h+=`<h2>${t.hunks} <span class="muted">(${n}/${PAGE.hunks.length} ${t.done})</span></h2>`+PAGE.hunks.map(x=>hunkHtml(x,t)).join("");
    h+=`<div class="row"><button class="primary" id="cf">${t.copyF}</button></div>`;
  }
  h+=`<h2>${t.files}</h2><div class="card"><ul>`+PAGE.files.map(f=>`<li><code>${esc(f)}</code></li>`).join("")+`</ul></div>`;
  $("#app").innerHTML=h;
}
function findings(){
  const lines=[`PR #${PAGE.pr} @ ${PAGE.sha.slice(0,12)} (${PAGE.tier})`];
  PAGE.hunks.forEach(h=>{lines.push(`- ${h.id} ${h.file}:${h.lines}: ${(st.ans[h.id]||"unjudged").toUpperCase()}${st.note[h.id]?" — "+st.note[h.id]:""}`);});
  return lines.join("\n");
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button"); if(!b) return;
  if(b.id==="vi"||b.id==="en"){st.lang=b.id;try{localStorage.setItem("hrg2.lang",st.lang);}catch(e){}render();return;}
  if(b.dataset.a){st.ans[b.dataset.id]=b.dataset.a;render();return;}
  if(b.dataset.ex){const h=PAGE.hunks.find(x=>x.id===b.dataset.ex);copy(T[st.lang].explainPrompt(h,PAGE));return;}
  if(b.id==="cf"){copy(findings());}
});
document.addEventListener("input",ev=>{const n=ev.target.dataset&&ev.target.dataset.note; if(n) st.note[n]=ev.target.value;});
render();
</script>
</body>
</html>
