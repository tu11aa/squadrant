name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Determine version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check
        run: |
          git fetch --tags
          if git rev-parse -q --verify "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.check.outputs.should_release == 'true'
        run: pnpm run build

      - name: Test
        if: steps.check.outputs.should_release == 'true'
        run: pnpm test

      - name: Extract release notes
        if: steps.check.outputs.should_release == 'true'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { flag=1; print; next }
            /^## \[/ && flag { flag=0 }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${{ steps.ver.outputs.tag }}" > release_notes.md
          fi

      # npm only falls back to Trusted Publishing (OIDC) when NO auth token is
      # configured. actions/setup-node with registry-url writes a
      # `//registry.npmjs.org/:_authToken=...` line into .npmrc, and an empty
      # value makes npm treat auth as present, skipping OIDC and failing with
      # ENEEDAUTH/E404. Strip that line so the OIDC path is taken.
      # Ref: actions/setup-node#1551
      - name: Strip poisoned npm auth config
        if: steps.check.outputs.should_release == 'true'
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          [ -f "$npmrc" ] && sed -i '/_authToken/d' "$npmrc" || true

      - name: Install latest npm
        if: steps.check.outputs.should_release == 'true'
        run: npm install -g npm@latest

      # Publish before tagging: the first OIDC publish is the risky step, so a
      # publish failure must leave no tag behind — otherwise the re-run sees the
      # tag and skips (should_release=false), stranding the release.
      - name: Publish to npm
        if: steps.check.outputs.should_release == 'true'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if curl -fsSL "https://registry.npmjs.org/squadrant/$VERSION" >/dev/null 2>&1; then
            echo "squadrant@$VERSION is already published — skipping npm publish"
          else
            npm publish --access public
          fi

      # Advisory only. Registry replication can lag well past the publish, and a
      # timeout here must never skip the tag/GitHub Release below — that is what
      # stranded the v0.22.0 release. Widen the window for the normal lag, then
      # warn and continue rather than fail the job.
      - name: Verify npm publish
        if: steps.check.outputs.should_release == 'true'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          for i in $(seq 1 36); do
            PUBLISHED=$(curl -fsSL "https://registry.npmjs.org/squadrant/$VERSION" | node -p "JSON.parse(require('fs').readFileSync(0)).version" 2>/dev/null || true)
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "✓ squadrant@$VERSION confirmed live on npm"
              exit 0
            fi
            echo "registry not yet showing $VERSION (attempt $i/36), retrying…"
            sleep 10
          done
          echo "::warning::squadrant@$VERSION did not appear on the npm registry within the verification window; continuing so the tag and GitHub Release are not skipped."
          exit 0

      - name: Create and push tag
        if: steps.check.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: release_notes.md
