name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Runtime smoke (catch ESM resolution crashes)
        run: |
          node dist/index.js --help
          node dist/index.js crew --help
          # #650: exercises the handoff-reconstruct module chain, which loads
          # node:sqlite — esbuild has silently stripped that prefix before
          # (no bare "sqlite" alias exists), throwing ERR_MODULE_NOT_FOUND at
          # runtime while staying invisible to vitest (which never touches
          # the bundled dist/). --help needs no registered project.
          node dist/index.js handoff reconstruct --help
          node dist/squadrantd.js --help

      - name: Test
        run: pnpm test
