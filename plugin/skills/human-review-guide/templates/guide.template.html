<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human review guide</title>
<!--
  Human review guide shell. LOCAL ONLY: never publish or post this file.
  Self-contained: no network, no libraries. Replace the GUIDE object below
  (invented sample data) with the facts gathered for the real PRs; keep the rest.
  Every localStorage access is wrapped in try/catch; the page works without it.

<style>
:root{--bg:#f7f7f9;--panel:#fff;--text:#1d1f24;--muted:#5d6370;--line:#dcdfe6;--accent:#2f5bea;--ok:#1a7f4b;--warn:#a15c00;--bad:#c0392b;--chip:#eef1f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--panel:#1d2026;--text:#e6e8ee;--muted:#9aa1b0;--line:#323744;--accent:#7b9cff;--ok:#4cc38a;--warn:#e0a24a;--bad:#ff7b6b;--chip:#272b34}}
:root[data-theme="dark"]{--bg:#14161a;--panel:#1d2026;--text:#e6e8ee;--muted:#9aa1b0;--line:#323744;--accent:#7b9cff;--ok:#4cc38a;--warn:#e0a24a;--bad:#ff7b6b;--chip:#272b34}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 64px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0}
header .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;flex:1 1 220px}
h2{font-size:17px;margin:26px 0 8px}h3{font-size:15px;margin:18px 0 6px}
.local{background:var(--bad);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.04em}
button,select,textarea,input{font:inherit;color:var(--text)}
button,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
button:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin}
nav.tabs button{white-space:nowrap;flex:0 0 auto}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{height:6px;background:var(--chip);border-radius:99px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.tablewrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;white-space:nowrap}
code{background:var(--chip);padding:1px 5px;border-radius:5px;font:13px ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
pre{background:var(--chip);padding:10px;border-radius:8px;overflow-x:auto;max-width:100%}
.chip{display:inline-block;background:var(--chip);border-radius:99px;padding:1px 9px;font-size:12px}
.chip.High{color:var(--bad)}.chip.Medium{color:var(--warn)}.chip.Low{color:var(--ok)}
details.point{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--panel)}
details.point>summary{cursor:pointer;padding:9px 12px;font-weight:600;list-style-position:inside}
details.point .body{padding:0 12px 12px}
dl.fields{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:6px 0}
dl.fields dt{color:var(--muted);font-weight:600}dl.fields dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:560px){dl.fields{grid-template-columns:1fr}dl.fields dt{margin-top:6px}}
.finding{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.finding input{flex:1 1 180px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
textarea{width:100%;min-height:90px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
label.chk{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
label.chk input{margin-top:5px}
.stack{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stack .node{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:3px 10px}
.muted{color:var(--muted)}
.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:7px 14px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
</style>
</head>

function findingsMarkdown() {
  const out = ["# " + g_(GUIDE.title) + " — " + GUIDE.date, ""];
  GUIDE.prs.forEach(pr => {
    const [d, n] = progressOf(pr), v = state.verdict[pr.id] || "";
    out.push("## #" + pr.id + " " + pr.title + " (`" + pr.sha + "`)", "Verdict: " + (v ? u("verdicts")[v] : "—") + " · checklist " + d + "/" + n);

    if (lines.length) out.push("", ...lines);

function verdictView() {
  const t = u;
  const out = h("textarea", { readonly: true, "aria-label": "findings", style: "min-height:180px" });
  const root = h("section", {}, h("h2", {}, t("verdict")));
  GUIDE.prs.forEach(pr => {
    const [d, n] = progressOf(pr), v = state.verdict[pr.id] || "";
    root.append(h("div", { class: "card" }, h("strong", {}, "#" + pr.id + " " + pr.title), h("div", {}, t("progress") + ": " + d + "/" + n, bar(d, n)), h("div", {}, u("verdicts")[v])));

async function copyFindings(out) {
  const md = findingsMarkdown(); out.value = md;
  try { await navigator.clipboard.writeText(md); toast(u("copied")); return; } catch (e) {}
  try { out.focus(); out.select(); if (document.execCommand("copy")) { toast(u("copied")); return; } } catch (e) {}
  toast(u("copyFail"));
}

/* ---------- shell ---------- */
function tabsList() {
  return [{ id: "read", label: u("readFirst") }, ...GUIDE.prs.map(p => ({ id: "pr" + p.id, label: "#" + p.id })), { id: "verdict", label: u("verdict") }];
}
function render() {
  document.documentElement.lang = L() === "primary" ? (GUIDE.langCode || "en") : "en";
  document.getElementById("title").textContent = g_(GUIDE.title);
  document.getElementById("local").textContent = u("local");
  const lb = document.getElementById("lang");
  lb.hidden = !GUIDE.primaryLabel;
  lb.textContent = L() === "primary" ? GUIDE.primaryLabel + " → EN" : "EN → " + GUIDE.primaryLabel;
  lb.setAttribute("data-lang", L());
  const th = state.theme || "auto";
  document.getElementById("theme").textContent = "◐ " + th;
  if (state.theme) document.documentElement.setAttribute("data-theme", state.theme); else document.documentElement.removeAttribute("data-theme");
  const tabs = tabsList();
  if (!tabs.some(x => x.id === state.tab)) state.tab = "read";
  document.getElementById("tabs").replaceChildren(...tabs.map(x => h("button", { role: "tab", "aria-selected": String(x.id === state.tab), onclick: () => { state.tab = x.id; save(); render(); window.scrollTo(0, 0); } }, x.label)));
  const main = document.getElementById("main");
  let view;
  if (state.tab === "read") view = readFirst();
  else if (state.tab === "verdict") view = verdictView();
  else view = prView(GUIDE.prs.find(p => "pr" + p.id === state.tab));
  main.replaceChildren(...(storeOk ? [] : [h("p", { class: "card muted" }, u("noStore"))]), view);
}
document.getElementById("lang").addEventListener("click", () => { state.lang = L() === "primary" ? "en" : "primary"; save(); render(); });
document.getElementById("theme").addEventListener("click", () => {
  state.theme = state.theme === "light" ? "dark" : state.theme === "dark" ? null : "light"; save(); render();
});
/* self-check: a filled-in template that leaks an object into the text fails loudly */
function selfCheck() {
  const prev = state.tab;
  const bad = tabsList().filter(x => { state.tab = x.id; render(); return document.body.innerText.includes("[object"); });
  state.tab = prev; render();
  if (bad.length) console.error("human-review-guide: '[object' text rendered in tab(s): " + bad.map(x => x.id).join(", "));
}
load();
if (!state.lang) state.lang = "primary";
render();
selfCheck();
</script>
